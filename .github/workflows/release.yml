# Release Workflow
#
# Cuts a release: tags the version in Cargo.toml, builds waycast for amd64 and
# arm64, and attaches the archives to a GitHub Release.
#
# Cargo.toml's version is the source of truth. Push a bump to main and this
# tags it and releases it; nothing else needs editing.
#
# The tagging lives here rather than in a workflow of its own because a tag
# pushed with GITHUB_TOKEN starts no workflows -- GitHub raises no
# workflow-triggering events for that token. A separate tagger would therefore
# need a personal access token to be worth anything, and that expires. Tagging
# in the same run that publishes needs no credential at all: the run is already
# here, so nothing has to be triggered.
#
# Setup Requirements:
# 1. No secrets required (GITHUB_TOKEN is auto-provided)
# 2. Settings -> Actions -> General -> Workflow permissions must allow
#    "Read and write permissions", or the release step cannot create the
#    release. The `permissions:` block below requests it per-job.
#
# Workflow Triggers:
# - Push to main. Releases when Cargo.toml names a version with no tag yet,
#   and exits in under a minute when it does not.
# - Push of a tag matching v[0-9]*, for releasing a tag cut by hand.
# - Manual dispatch, which builds and uploads artifacts but publishes no
#   release, so the build can be exercised without tagging.
#
# Relationship to the other tag-triggered workflows:
# - rust.yml already runs fmt, clippy, tests, docs and a build on v[0-9]*
#   tags, so this workflow deliberately does not repeat them.
# - It runs in PARALLEL with rust.yml rather than after it, so a tag whose
#   tests fail will still publish binaries. That is a deliberate trade for a
#   simple, predictable trigger; if it matters, gate this on rust.yml the way
#   aur-publish.yml does, with `on: workflow_run`.
# - aur-publish.yml is called by this workflow as a final job, and is handed
#   the version rather than inferring it from an event payload.
#
# Notes on what these archives are, and are not:
# - The binary is dynamically linked against GStreamer, PipeWire and glib.
#   It is not self-contained: the runtime packages named in the README are
#   still required on the target machine. This is not a static build because
#   GStreamer loads its plugins as shared objects at runtime, so a static
#   waycast would still need the plugin set present to do anything.
# - Built on Ubuntu 24.04, so the binaries need glibc 2.39 or newer. They
#   will not run on older distributions; those should build from source.
# - arm64 builds on a native runner rather than cross-compiling. Cross would
#   mean assembling an arm64 sysroot for the whole GStreamer and PipeWire
#   stack, which is far more fragile than using the runner GitHub provides.

name: Release

on:
  push:
    branches: [main]
    tags:
      - v[0-9]*
  workflow_dispatch:

jobs:
  prepare:
    name: Decide what to release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.decide.outputs.version }}
      publish: ${{ steps.decide.outputs.publish }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          # Tags are needed to tell an already-released version from a new one.
          fetch-depth: 0

      - name: Decide
        id: decide
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            # Exercising the build, not releasing.
            echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # A tag cut by hand; release exactly it.
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ -z "$version" ]; then echo "no version in Cargo.toml" >&2; exit 1; fi
          tag="v${version}"
          echo "version=${tag}" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "${tag} is already released; nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A bump committed without its regenerated Cargo.lock builds here and
          # fails the --locked build below, which would leave a tag with no
          # release. `cargo metadata` catches it without compiling anything.
          if ! cargo metadata --locked --format-version 1 >/dev/null; then
            echo "Cargo.lock is out of step with Cargo.toml. Commit the lock" >&2
            echo "alongside the bump: cargo update --workspace" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "Release ${version}"
          git push origin "${tag}"
          echo "Tagged ${tag}."
          echo "publish=true" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }}
    needs: prepare
    if: ${{ needs.prepare.outputs.publish == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            libpipewire-0.3-dev \
            pkg-config

      - name: Install stable toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@stable

      - run: rustup override set ${{steps.toolchain.outputs.name}}

      # --locked so a release is built from the committed Cargo.lock rather
      # than whatever resolves on the day.
      - name: Build
        run: cargo build --release --locked --bin waycast --bin waycast-networkd

      - name: Package
        id: package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          name="waycast-${VERSION}-linux-${{ matrix.arch }}"

          strip target/release/waycast target/release/waycast-networkd
          mkdir -p "dist/${name}/contrib/networkd" "dist/${name}/docs"
          cp target/release/waycast target/release/waycast-networkd "dist/${name}/"
          cp contrib/networkd/install.py contrib/networkd/*.service contrib/networkd/*.conf \
            contrib/networkd/*.policy contrib/networkd/*.rules "dist/${name}/contrib/networkd/"
          cp docs/network-helper.md docs/networking.md "dist/${name}/docs/"
          cp LICENSE README.md "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          ( cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256" )

          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: [prepare, build]
    if: ${{ needs.prepare.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # gh is preinstalled on the runners, so this needs no third-party
      # action for the one step that holds a write token.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          # Not GITHUB_REF_NAME: on a push to main that is "main", which would
          # name the release and its install instructions after the branch.
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          notes="$(mktemp)"
          {
            echo "## Install"
            echo
            echo '```bash'
            echo "tar xzf waycast-${VERSION}-linux-\$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz"
            echo "install -Dm755 waycast-*/waycast ~/.local/bin/waycast"
            echo '(cd waycast-*-linux-* && sudo python3 contrib/networkd/install.py --binary ./waycast-networkd)'
            echo 'waycast doctor'
            echo '```'
            echo
            echo "Or build from source:"
            echo
            echo '```bash'
            echo "cargo install --git ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY} --tag ${VERSION} waycast-cli --bin waycast --root ~/.local"
            echo '```'
            echo
            echo "These binaries are dynamically linked and need the GStreamer,"
            echo "PipeWire and portal packages listed in the README, plus glibc"
            echo "2.39 or newer. Run \`waycast doctor\` to check the host."
          } > "$notes"

          gh release create "${VERSION}" \
            --title "${VERSION}" \
            --notes-file "$notes" \
            --verify-tag \
            dist/*.tar.gz dist/*.sha256

  aur:
    name: AUR
    needs: [prepare, release]
    if: ${{ needs.prepare.outputs.publish == 'true' }}
    uses: ./.github/workflows/aur-publish.yml
    with:
      tag: ${{ needs.prepare.outputs.version }}
    secrets: inherit
