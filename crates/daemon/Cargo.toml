[package]
name = "waycast-daemon"
version.workspace = true
edition.workspace = true

[dependencies]
waycast-networkd = { path = "../networkd" }
waycast-doctor = { path = "../doctor" }
waycast-capture = { path = "../capture", features = ["real_portal"] }
waycast-stream = { path = "../stream" }
waycast-net = { path = "../net" }
waycast-rtsp = { path = "../rtsp" }
waycast-audio = { path = "../audio" }
waycast-external = { path = "../external" }
anyhow.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["macros", "sync", "time", "signal"] }
parking_lot.workspace = true
gstreamer.workspace = true
aes = "0.9"
ctr = "0.10"
hmac = "0.12"
rand.workspace = true
rsa = { version = "0.9", features = ["sha2", "sha1"] }
sha1 = "0.10"
sha2 = "0.10"

[dev-dependencies]
zbus.workspace = true
