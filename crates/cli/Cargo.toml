[package]
name = "waycast-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "waycast"
path = "src/main.rs"

[[bin]]
name = "validate-rtsp"
path = "src/bin/validate-rtsp.rs"

[[bin]]
name = "validate-wfd"
path = "src/bin/validate-wfd.rs"

[[bin]]
name = "diagnose-session"
path = "src/bin/diagnose-session.rs"

[dependencies]
waycast-networkd = { path = "../networkd" }
waycast-daemon = { path = "../daemon" }
waycast-net = { path = "../net" }
waycast-rtsp = { path = "../rtsp" }
waycast-doctor = { path = "../doctor" }
waycast-capture = { path = "../capture" }
waycast-stream = { path = "../stream" }
waycast-external = { path = "../external" }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
clap = { version = "4.0", features = ["derive"] }
tabled = "0.21"
serde = { workspace = true }
serde_json = { workspace = true }
regex-lite = "0.1"
